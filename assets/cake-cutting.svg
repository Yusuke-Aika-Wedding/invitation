<style>
  .hands{animation:press 3.6s infinite}.groom-arm{animation:groom 3.6s infinite}.bride-arm{animation:bride 3.6s infinite}
  .veil{transform-origin:301px 98px;animation:veil 7.2s ease-in-out infinite}
  @keyframes press{0%,12%,100%{transform:translateY(0)}48%,66%{transform:translateY(14px)}}
  @keyframes groom{0%,12%,100%{d:path('M157 168 Q165 188 185 190 L214 201 L210 215 Q185 211 169 207 Q148 204 144 189 Z')}48%,66%{d:path('M157 168 Q166 191 184 199 L214 215 L210 229 Q183 222 167 216 Q147 207 144 189 Z')}}
