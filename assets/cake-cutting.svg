  <linearGradient id="hair"><stop stop-color="#554538"/><stop offset=".45" stop-color="#312923"/><stop offset="1" stop-color="#201e20"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
