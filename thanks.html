<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4ecdc">
  <title>ありがとう | Yusuke &amp; Aika</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Noto+Serif+JP:wght@400;500;600;700&amp;family=Old+Standard+TT:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260919-champagne-thanks">
</head>
<body class="thanks-page">
  <main id="specialThanks" class="thanks-site" hidden>
    <article class="thanks-hero">
      <img src="assets/gallery-1.jpg" alt="祐輔と愛佳の写真">
      <div class="thanks-letter">
        <h1 class="section-kicker thanks-reveal">Thank You</h1>
        <p><span class="thanks-line thanks-reveal">私たちの結婚式にお越しいただき、</span><span class="thanks-line thanks-reveal">本当にありがとうございました。</span></p>
        <p><span class="thanks-line thanks-reveal">皆様と過ごした大切な一日を、</span><span class="thanks-line thanks-reveal">これからもずっと心に刻んで。</span></p>
        <p><span class="thanks-line thanks-reveal">これからも、私たちふたりを</span><span class="thanks-line thanks-reveal">どうぞよろしくお願いいたします。</span></p>
        <div id="puzzleAchievement" class="thanks-achievement" role="status" hidden>
          <p><span class="thanks-line">あなたは、<span class="achievement-title">The Last Puzzle</span> を</span><span class="thanks-line"><strong id="puzzleRank" class="number-font"></strong>番目に解き明かしました！</span></p>
        </div>
        <div class="thanks-signature thanks-reveal">Yusuke &amp; Aika</div>
      </div>
    </article>
    <footer class="footer">
      <p id="visitRecordStatus" class="thanks-record-status" role="status"></p>
      <button id="retryVisitRecord" class="change-guest-id" type="button" hidden>もう一度試す</button>
      <div><button id="changeGuestId" class="change-guest-id" type="button">IDを変更する</button></div>
    </footer>
  </main>
  <script src="js/config.js"></script>
  <script src="js/guest-access.js?v=20260919-champagne-thanks"></script>
  <script src="js/thanks.js?v=20260919-champagne-thanks"></script>
</body>
</html>
