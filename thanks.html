<head>
  <meta charset="utf-8">

  <title>ありがとう | Yusuke &amp; Aika</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css?v=20260919-last-puzzle">

<body>
  <main id="specialThanks" class="thanks-site" hidden>
    <article class="thanks-hero">
      <img src="assets/gallery-1.jpg" alt="祐輔と愛佳の写真">
      <div class="thanks-letter">
        <p class="section-kicker">Thank You</p>
        <h1>ありがとう</h1>
        <p><span class="thanks-line">私たちの結婚式にお越しいただき、</span><span class="thanks-line">本当にありがとうございました。</span></p>
        <p><span class="thanks-line">皆様と過ごした大切な一日を、</span><span class="thanks-line">これからもずっと心に刻んで。</span></p>
        <p><span class="thanks-line">これからも、私たちふたりを</span><span class="thanks-line">どうぞよろしくお願いいたします。</span></p>
        <div class="thanks-signature">Yusuke &amp; Aika</div>
      </div>
    </article>
    <footer class="footer">
      <p id="visitRecordStatus" class="thanks-record-status" role="status"></p>
      <button id="retryVisitRecord" class="change-guest-id" type="button" hidden>もう一度試す</button>
      <div><button id="changeGuestId" class="change-guest-id" type="button">IDを変更する</button></div>
    </footer>
  </main>
  <script src="js/config.js"></script>
  <script src="js/guest-access.js?v=20260919-last-puzzle"></script>
  <script src="js/thanks.js?v=20260919-last-puzzle"></script>
